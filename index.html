<!DOCTYPE html>

<title>Citadel — Raid Reports</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: "Helvetica Neue", Arial, sans-serif;
  margin: 0; background: #263238; color: #eceff1;
}
header {
  padding: 28px 24px 18px; background: #1c262b;
  border-bottom: 3px solid #607d8b;
}
h1 { margin: 0; font-size: 26px; }
.sub { color: #90a4ae; font-size: 14px; margin-top: 4px; }
main { max-width: 1200px; margin: 0 auto; padding: 20px 24px 60px; }
.columns { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 800px) { .columns { grid-template-columns: 1fr; } }
.col h2 {
  font-size: 17px; margin: 6px 0 4px; padding-bottom: 6px;
  border-bottom: 2px solid #607d8b; color: #b0bec5;
}
.other-header { margin-top: 26px; }
.night {
  background: #2f3d44; border-radius: 8px; padding: 14px 18px;
  margin: 14px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
}
.night .info { flex: 1 1 300px; }
.night .title { font-weight: 600; font-size: 16px; }
.night .meta { color: #90a4ae; font-size: 13px; margin-top: 2px; }
.night a.btn {
  display: inline-block; padding: 7px 16px; border-radius: 16px;
  background: #607d8b; color: #fff; text-decoration: none; font-size: 14px;
}
.night a.btn:hover { background: #78909c; }
.night a.wcl { background: transparent; border: 1px solid #607d8b; }
footer { text-align: center; color: #546e7a; font-size: 12px; padding: 20px; }
</style>
</head>
